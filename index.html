<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вибори Президента України</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root{--blue:#002f61;--blue-dark:#004494;--yellow:#FFD700;--bg:#f5f7fa;--card:#fff;--border:#e2e8f0;--text:#1a202c;--muted:#64748b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);color:#fff;padding:40px 20px;text-align:center;border-bottom:4px solid var(--yellow)}
  header h1{font-size:clamp(1.5rem,4vw,2.25rem);font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
  header p{font-size:clamp(.95rem,2.5vw,1.1rem);opacity:.95}
  main{max-width:1000px;margin:0 auto;padding:32px 20px 60px}
  .candidates{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:28px}
  .candidate{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
  .candidate:hover{border-color:#cbd5e1;box-shadow:0 4px 14px rgba(0,0,0,.06)}
  .candidate.selected{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,87,183,.15)}
  .candidate.selected::after{content:"✓";position:absolute;top:10px;right:12px;background:var(--blue);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .candidate img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--border);margin-bottom:14px;background:#e2e8f0}
  .candidate.selected img{border-color:var(--blue)}
  .candidate .name{font-size:1.05rem;font-weight:700;margin-bottom:4px}
  .candidate .party{font-size:.88rem;color:var(--muted);margin-bottom:14px}
  .candidate input[type="radio"]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--border);border-radius:50%;position:relative;cursor:pointer;margin-top:auto}
  .candidate input[type="radio"]:checked{border-color:var(--blue)}
  .candidate input[type="radio"]:checked::after{content:"";position:absolute;inset:4px;background:var(--blue);border-radius:50%}
  .vote-btn{display:block;width:100%;max-width:420px;margin:0 auto 18px;padding:18px 24px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:background .15s;letter-spacing:.02em}
  .vote-btn:hover:not(:disabled){background:var(--blue-dark)}
  .vote-btn:disabled{opacity:.55;cursor:not-allowed}
  .message{max-width:520px;margin:0 auto 28px;padding:16px 20px;border-radius:12px;text-align:center;font-weight:600;display:none}
  .message.show{display:block}
  .message.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
  .message.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .loading{text-align:center;color:var(--muted);padding:24px}
  footer{text-align:center;padding:24px;color:var(--muted);font-size:.85rem}
  #turnstile-wrap{display:flex;justify-content:center;margin-bottom:18px}
  @media(max-width:600px){header{padding:28px 16px}main{padding:20px 14px 40px}.candidate{padding:16px}.candidate img{width:90px;height:90px}}
  #countdown-screen{position:fixed;inset:0;z-index:99999;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Arial,sans-serif;padding:20px}
  #timer{font-size:clamp(28px,7vw,80px);font-weight:bold;line-height:1.5}
  #timer small{display:block;font-size:clamp(14px,2.5vw,22px);font-weight:normal;margin-bottom:20px}
  .tour-countdown{text-align:center;padding:20px}
  .tour-countdown__title{margin-bottom:8px;font-size:1.25rem;font-weight:600}
  .tour-countdown__time{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="countdown-screen"><div id="timer"><small>До початку голосування</small>Завантаження...</div></div>

<header>
  <h1>Вибори Президента України</h1>
  <p>Оберіть одного кандидата</p>
</header>

<div class="tour-countdown">
  <div class="tour-countdown__title">До кінця другого туру</div>
  <div class="tour-countdown__time" id="tour-countdown" role="timer" aria-live="polite">Завантаження…</div>
</div>

<main>
  <div id="candidatesWrap"><div class="loading">Завантаження кандидатів…</div></div>

  <div id="turnstile-wrap"></div>

  <button class="vote-btn" id="voteBtn" disabled>Проголосувати</button>

  <div class="message" id="message"></div>
</main>

<footer>Онлайн-опитування. Не є офіційними виборами.</footer>

<script>
  const TOUR_END = new Date('2026-10-5T12:00:00+02:00').getTime();
  const countdownEl = document.getElementById('tour-countdown');
  let tourInterval = null;

  function updateTourCountdown() {
    const remaining = TOUR_END - Date.now();
    if (remaining <= 0) {
      countdownEl.textContent = 'Другий Тур завершено';
      if (tourInterval) clearInterval(tourInterval);
      return;
    }
    const d = Math.floor(remaining / 86400000);
    const h = Math.floor((remaining % 86400000) / 3600000);
    const m = Math.floor((remaining % 3600000) / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    countdownEl.textContent = `${d} дн. ${String(h).padStart(2,'0')} год. ${String(m).padStart(2,'0')} хв. ${String(s).padStart(2,'0')} сек.`;
  }
  updateTourCountdown();
  tourInterval = setInterval(updateTourCountdown, 1000);
</script>

<script>
  const DEADLINE = new Date('2026-10-2T12:00:00+02:00').getTime();
  let countdownInterval = null;

  function updateStartCountdown() {
    const diff = DEADLINE - Date.now();
    const screen = document.getElementById('countdown-screen');
    const timer = document.getElementById('timer');
    if (diff <= 0) {
      screen.style.display = 'none';
      if (countdownInterval) clearInterval(countdownInterval);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff / 3600000) % 24;
    const m = Math.floor(diff / 60000) % 60;
    const s = Math.floor(diff / 1000) % 60;
    timer.innerHTML = `<small>До початку голосування</small>${d}д ${h}г ${m}хв ${s}с`;
  }
  updateStartCountdown();
  countdownInterval = setInterval(updateStartCountdown, 1000);
</script>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzw2Efa3JJl4XuywdLFSSukC4nces45sYTmOfdjYhKnEQ8-FDm-6I4Az6iYsR6c9Gding/exec';
  const TURNSTILE_SITE_KEY = '0x4AAAAAAFWprVDJGF1Savte';
  const STORAGE_KEY = 'voted_client_id_tour_3';

  const clientId = (() => {
    let id = localStorage.getItem(STORAGE_KEY + '_id');
    if (!id) {
      id = (crypto.randomUUID && crypto.randomUUID()) || ('id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      localStorage.setItem(STORAGE_KEY + '_id', id);
    }
    return id;
  })();

  const state = { candidates: [], selectedId: null, hasVoted: false, turnstileToken: null };

  const els = {
    wrap: document.getElementById('candidatesWrap'),
    btn: document.getElementById('voteBtn'),
    msg: document.getElementById('message'),
    turnstileWrap: document.getElementById('turnstile-wrap')
  };

  function showMessage(text, type) {
    els.msg.textContent = text;
    els.msg.className = 'message show ' + (type || 'success');
  }
  function hideMessage() { els.msg.className = 'message'; }

  function escapeHtml_(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function apiPost(action, data) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, data || {})),
      redirect: 'follow'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json;
  }

  async function getUserIp() {
    const r = await fetch('https://api64.ipify.org?format=json', { cache: 'no-store' });
    if (!r.ok) throw new Error('IP lookup failed');
    const d = await r.json();
    if (!d || !d.ip) throw new Error('IP lookup failed');
    return d.ip;
  }

  function renderCandidates() {
    if (!state.candidates.length) {
      els.wrap.innerHTML = '<div class="loading">Кандидатів не знайдено.</div>';
      return;
    }
    els.wrap.className = 'candidates';
    els.wrap.innerHTML = state.candidates.map(c => {
      const id = escapeHtml_(c.id);
      const name = escapeHtml_(c.name);
      const party = escapeHtml_(c.party);
      const photo = escapeHtml_(c.photo_url);
      const fallback = "this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22110%22 height=%22110%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23e2e8f0%22/><text x=%2250%25%22 y=%2255%25%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22>?</text></svg>'";
      return `<label class="candidate" data-id="${id}">
        <img src="${photo}" alt="${name}" onerror="${fallback}">
        <div class="name">${name}</div>
        <div class="party">${party}</div>
        <input type="radio" name="candidate" value="${id}">
      </label>`;
    }).join('');

    els.wrap.querySelectorAll('.candidate').forEach(el => {
      el.addEventListener('click', () => selectCandidate(el.dataset.id));
    });
  }

  function selectCandidate(id) {
    if (state.hasVoted) return;
    state.selectedId = id;
    els.wrap.querySelectorAll('.candidate').forEach(el => {
      const on = el.dataset.id === id;
      el.classList.toggle('selected', on);
      const input = el.querySelector('input');
      if (input) input.checked = on;
    });
    els.btn.disabled = !state.turnstileToken;
    hideMessage();
  }

  function lockVotingUI() {
    state.hasVoted = true;
    els.btn.disabled = true;
    els.btn.textContent = 'Ви вже проголосували';
    els.wrap.querySelectorAll('input').forEach(i => { i.disabled = true; });
  }

  function setTurnstileToken(token) {
    state.turnstileToken = token || null;
    els.btn.disabled = !state.turnstileToken || !state.selectedId;
  }

  async function submitVote() {
    if (state.hasVoted) { showMessage('Ви вже проголосували.', 'error'); return; }
    if (!state.selectedId) { showMessage('Оберіть кандидата.', 'error'); return; }
    if (!state.turnstileToken) { showMessage('Підтвердіть, що ви не робот.', 'error'); return; }

    els.btn.disabled = true;
    els.btn.textContent = 'Надсилання…';
    hideMessage();

    try {
      let ip;
      try {
        ip = await getUserIp();
      } catch (_) {
        throw new Error('');
      }

      const data = await apiPost('vote', {
        candidate_id: state.selectedId,
        client_id: clientId,
        client_ip: ip,
        turnstile_token: state.turnstileToken
      });

      if (data.ok) {
        localStorage.setItem(STORAGE_KEY, '1');
        lockVotingUI();
        showMessage('Ваш голос прийнято. Дякуємо!', 'success');
      } else {
        throw new Error(data.error || 'Помилка голосування');
      }
    } catch (e) {
      els.btn.disabled = false;
      els.btn.textContent = 'Проголосувати';
      showMessage('Помилка: ' + e.message, 'error');
    }
  }

  async function loadCandidates() {
    try {
      const data = await apiPost('config', {});
      state.candidates = data.candidates || [];
      renderCandidates();
    } catch (e) {
      els.wrap.innerHTML = '<div class="loading">Помилка завантаження: ' + escapeHtml_(e.message) + '</div>';
    }
  }

  function initTurnstile() {
    if (!window.turnstile) return;
    window.turnstile.render(els.turnstileWrap, {
      sitekey: TURNSTILE_SITE_KEY,
      callback: setTurnstileToken,
      'expired-callback': () => setTurnstileToken(null),
      'error-callback': () => setTurnstileToken(null)
    });
  }

  els.btn.addEventListener('click', submitVote);

  (async function init() {
    await loadCandidates();
    if (localStorage.getItem(STORAGE_KEY) === '1') lockVotingUI();
    if (window.turnstile) initTurnstile();
    else window.addEventListener('load', initTurnstile);
  })();
</script>
</body>
</html>
